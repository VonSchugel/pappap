name: Marqicci Android
on:
  push:
    branches: ["codex/marqicci-android", "main", "marqicci-android", "codex/marqicci-*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: 'if test -f Marqicci/gradlew; then echo "BOOK_DIR=Marqicci" >> "$GITHUB_ENV"; else echo "BOOK_DIR=." >> "$GITHUB_ENV"; fi'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and instrumentation APKs
        run: cd "$BOOK_DIR" && bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview
      - name: Verify APK signature
        run: |
          for variant in debug preview; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$BOOK_DIR/app/build/outputs/apk/$variant/app-$variant.apk"
          done
      - uses: actions/upload-artifact@v7
        if: matrix.api == 35
        with:
          path: ${{ env.BOOK_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.api == 35
        with:
          path: ${{ env.BOOK_DIR }}/app/build/outputs/apk/preview/app-preview.apk
          archive: false
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install connected-test service
        run: cd "$BOOK_DIR" && python -m pip install -r server/requirements.txt
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          script: cd "$BOOK_DIR" && bash scripts/device-checks.sh
      - name: Save emulator screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screen-previews-api-${{ matrix.api }}
          path: ${{ env.BOOK_DIR }}/build/ui-review/*.png
          if-no-files-found: warn
      - name: Inspect demo screen layout
        if: ${{ !cancelled() && contains(github.event.head_commit.message, '[visual review]') }}
        run: |
          cd "$BOOK_DIR"
          python -m pip install -q pillow
          python - <<'PY'
          import base64, io, pathlib
          from PIL import Image
          root = pathlib.Path("build/ui-review")
          for label, names in [("tabs", ["today","schedule","brief","journal"]), ("writing", ["focus","dark-large"])]:
              screens = []
              for name in names:
                  path = root / (name + ".png")
                  if path.exists():
                      screen = Image.open(path).convert("RGB")
                      screen.thumbnail((290, 690))
                      screens.append(screen)
              if not screens:
                  continue
              canvas = Image.new("RGB", (sum(s.width for s in screens),max(s.height for s in screens)), "white")
              offset = 0
              for screen in screens:
                  canvas.paste(screen,(offset,0))
                  offset += screen.width
              data = io.BytesIO()
              canvas.save(data, format="JPEG", quality=72, optimize=True)
              encoded = base64.b64encode(data.getvalue()).decode()
              for i in range(0,len(encoded),512):
                  print("UI_PROOF_"+label+" "+encoded[i:i+512])
          PY
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test API and generation
        run: |
          if test -f Marqicci/gradlew; then cd Marqicci; fi
          python -m pip install -r server/requirements.txt httpx
          python -m unittest discover -s server -p 'test_*.py' -v
      - name: Verify an n8n publication with the phone closed
        timeout-minutes: 10
        run: |
          if test -f Marqicci/gradlew; then cd Marqicci; fi
          bash scripts/check-scheduler.sh

